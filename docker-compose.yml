services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freq
      POSTGRES_PASSWORD: freq
      POSTGRES_DB: freqdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freq -d freqdb"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://freq:freq@db:5432/freqdb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dbdata:
